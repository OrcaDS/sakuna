[project]
name = "sakuna"
version = "0.1.0"
description = "Open, town-level history of Philippine typhoon and monsoon impacts, rebuilt from DSWD DROMIC situation reports."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []  # pdfplumber, pyarrow, dbt-core, dbt-duckdb arrive with the milestones that use them (project.md §4)

[project.scripts]
sakuna = "sakuna.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sakuna"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["docs/research_scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "T20"]  # T20 bans print(): pipeline code must use logging

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["T20"]

[tool.pytest.ini_options]
testpaths = ["tests"]
